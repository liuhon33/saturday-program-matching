name: Tests and sharing checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r version_1/requirements.txt
      - run: python -B -m unittest discover -s tests -v
        working-directory: version_1
      - run: python -B version_1/tools/check_release.py
